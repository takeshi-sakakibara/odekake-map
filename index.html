<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>れいとランプのお出かけマップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;color:#222}
  #wrap{display:flex;flex-direction:column;height:100%}
  #bar{padding:8px 10px;background:#fffaf2;border-bottom:1px solid #eadfcd;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  #bar h1{font-size:15px;margin:0 8px 0 0;white-space:nowrap}
  .chip{border:1px solid #d9cbb5;background:#fff;border-radius:16px;padding:4px 10px;font-size:13px;cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:4px}
  .chip.off{opacity:.4;text-decoration:line-through}
  .chip .n{color:#888;font-size:11px}
  #q{flex:1;min-width:140px;max-width:260px;border:1px solid #d9cbb5;border-radius:16px;padding:5px 10px;font-size:13px}
  #map{flex:1}
  .pin{width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .pin.v{border-color:#e65100}.pin.u{border-color:#0288d1}
  .cl{border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.85)}
  .pop h3{margin:0 0 4px;font-size:15px}
  .pop .tag{display:inline-block;font-size:11px;border-radius:8px;padding:1px 7px;margin-bottom:6px;color:#fff}
  .pop p{margin:0 0 6px;white-space:pre-line;font-size:13px}
  .pop a{font-size:13px}
  .legend{background:#fff;padding:6px 8px;border-radius:6px;font-size:12px;line-height:1.6;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
</style>
</head>

<div id="wrap">

  </div>
  <div id="map"></div>
</div>

w.google.com/maps/search/?api=1&query=%E3%81%A4%E3%81%B0%E3%81%95%E3%83%89%E3%83%83%E3%82%B0%E3%83%A9%E3%83%B3&query_place_id=ChIJ97vTbC1iGGARRqdX8iQ6Sow"],["北本グリーンクロス","ドッグランあります",36.043947,139.529052,"dogrun",0,"https://www.google.com/maps/search/?api=1&query=%E5%8C%97%E6%9C%AC%E3%82%B0%E3%83%AA%E3%83%BC%E3%83%B3%E3%82%AF%E3%83%AD%E3%82%B9&query_place_id=ChIJN7U45vXNGGARN-ETv63eh3k"],["キラナガーデン豊洲","店内一部\nドッグラン有",35.642569,139.777653,"dogrun",0,"https://www.google.com/maps/search/?api=1&query=%E3%82%AD%E3%83%A9%E3%83%8A%E3%82%AC%E3%83%BC%E3%83%87%E3%83%B3%E8%B1%8A%E6%B4%B2&query_place_id=ChIJ6agapkGJGGARBULNbsceEqA"],["BerryGarden王禅寺ドッグラン","ドッグラン、釣り堀、BBQ併設",35.58921,139.524948,"dogrun",0,"https://www.google.com/maps/search/?api=1&query=BerryGarden%E7%8E%8B%E7%A6%85%E5%AF%BA%E3%83%89%E3%83%83%E3%82%B0%E3%83%A9%E3%83%B3&query_place_id=ChIJu6hQzX_7GGARDKqVLMNOsY0"]];
const CATS = {
  visited:{label:"ワンコと訪問したお店", emoji:"🍽️"},
  info:   {label:"気になるお店（未訪問）", emoji:"🍴"},
  shrine: {label:"神社仏閣", emoji:"⛩️"},
  dogrun: {label:"ドッグラン", emoji:"🐕"}
};
const on = {visited:true, info:true, shrine:true, dogrun:true};

const map = L.map('map', {zoomControl:true}).setView([35.45, 139.5], 9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const cluster = L.markerClusterGroup({
  showCoverageOnHover:false, maxClusterRadius:55, spiderfyOnMaxZoom:true,
  iconCreateFunction: c => {
    const n = c.getChildCount();
    const ms = c.getAllChildMarkers();
    const v = ms.filter(m => m.options.visited).length;
    const s = n < 10 ? 34 : n < 50 ? 42 : 52;
    // 訪問済みが多いほどオレンジ、未訪問が多いほど青
    const bg = v*2 >= n ? '#e65100' : '#0288d1';
    return L.divIcon({html:`<div class="cl" style="width:${s}px;height:${s}px;background:${bg};font-size:${s>40?15:13}px">${n}</div>`,
      className:'', iconSize:[s,s]});
  }
});
map.addLayer(cluster);

const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const markers = SPOTS.map(([name, desc, lat, lng, cat, visited, link]) => {
  const icon = L.divIcon({className:'', iconSize:[28,28], iconAnchor:[14,14], popupAnchor:[0,-12],
    html:`<div class="pin ${visited?'v':'u'}">${CATS[cat].emoji}</div>`});
  const m = L.marker([lat,lng], {icon, visited:!!visited, title:name});
  const tagColor = visited ? '#e65100' : '#0288d1';
  const tagText = cat==='dogrun' ? (visited?'ドッグラン（行った）':'ドッグラン（未訪問）') : CATS[cat].label;
  m.bindPopup(`<div class="pop"><h3>${esc(name)}</h3><span class="tag" style="background:${tagColor}">${esc(tagText)}</span>`
    + (desc ? `<p>${esc(desc)}</p>` : '')
    + (link ? `<a href="${esc(link)}" target="_blank" rel="noopener">📍 Googleマップで開く</a>` : '') + `</div>`);
  m._cat = cat; m._name = name.toLowerCase();
  return m;
});

function refresh(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  cluster.clearLayers();
  const shown = markers.filter(m => on[m._cat] && (!q || m._name.includes(q)));
  cluster.addLayers(shown);
  if (q && shown.length) map.fitBounds(L.featureGroup(shown).getBounds().pad(0.3), {maxZoom:16});
}

const chips = document.getElementById('chips');
for (const [k, c] of Object.entries(CATS)) {
  const n = SPOTS.filter(s => s[4]===k).length;
  const el = document.createElement('span');
  el.className = 'chip'; el.innerHTML = `${c.emoji} ${c.label} <span class="n">${n}</span>`;
  el.onclick = () => { on[k] = !on[k]; el.classList.toggle('off', !on[k]); refresh(); };
  chips.appendChild(el);
}
document.getElementById('q').addEventListener('input', refresh);

const legend = L.control({position:'bottomleft'});
legend.onAdd = () => { const d = L.DomUtil.create('div','legend');
  d.innerHTML = '<span class="dot" style="background:#e65100"></span>行った<br><span class="dot" style="background:#0288d1"></span>まだ行ってない<br>数字＝まとめた件数（拡大すると分かれます）';
  return d; };
legend.addTo(map);

refresh();
map.fitBounds(L.featureGroup(markers).getBounds().pad(0.05));
</script>
